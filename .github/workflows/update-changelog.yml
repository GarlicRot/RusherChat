name: Update Changelog

on:
  push:
    branches: [master]
    paths:
      - '**.java' # Trigger on Java file changes
      - '**.md' # Trigger on Markdown changes (e.g., README)
      - '!CHANGELOG.md' # Exclude changes to CHANGELOG.md itself

jobs:
  changelog:
    name: Generate Changelog Entries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch full history for git log

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Debug Git log
        run: |
          echo "Listing recent commits:"
          git log -n 10 --pretty=format:'%h %an %ad %s' --date=short
          echo "Last CHANGELOG.md commit:"
          git log -1 --pretty=%H -- CHANGELOG.md || echo "No CHANGELOG.md commits found"

      - name: Generate changelog entries
        run: |
          # Read existing CHANGELOG.md or create a new one
          if [ ! -f CHANGELOG.md ]; then
            echo -e "# Changelog\n\nAll notable changes to **${{ github.event.repository.name }}** are documented here.\n\n## [Unreleased]\n- No unreleased changes at this time." > CHANGELOG.md
          fi

          # Get the hash of the last commit that modified CHANGELOG.md
          last_changelog_commit=$(git log -1 --pretty=%H -- CHANGELOG.md || echo "")
          if [ -z "$last_changelog_commit" ]; then
            # If no changelog commit exists, get all commits
            latest_commits=$(git log --pretty=format:'%h%x1f%an%x1f%ad%x1f%s%x1f%b' --date=short)
          else
            # Get commits since the last changelog update
            latest_commits=$(git log $last_changelog_commit..HEAD --pretty=format:'%h%x1f%an%x1f%ad%x1f%s%x1f%b' --date=short)
          fi

          # Filter for meaningful commits (exclude merges and changelog updates)
          filtered_commits=$(echo "$latest_commits" | grep -v -E '^Merge |^docs\(changelog\):')

          if [ -z "$filtered_commits" ]; then
            echo "No new meaningful commits to add to changelog."
            exit 0
          fi

          # Prepare new entries for [Unreleased] section
          echo "$filtered_commits" | awk -F'\x1f' '
            {
              hash=$1;
              author=$2;
              date=$3;
              subject=$4;
              body=$5;

              # Skip empty or irrelevant commits
              if (subject !~ /^Merge / && subject !~ /^docs\(changelog\):/) {
                printf "- `%s` – [`%s`](https://github.com/${{ github.repository }}/commit/%s) by %s\n", subject, hash, hash, author;
                if (length(body) > 1) {
                  n = split(body, lines, "\n");
                  for (i = 1; i <= n; i++) {
                    if (length(lines[i]) > 0 && lines[i] !~ /^[[:space:]]*$/) {
                      printf "  - %s\n", lines[i];
                    }
                  }
                }
                print "";
              }
            }
          ' > new_entries.txt

          # Debug: Show new entries
          echo "New changelog entries:"
          cat new_entries.txt

          # Insert new entries into CHANGELOG.md under [Unreleased]
          if [ -s new_entries.txt ]; then
            awk '
              BEGIN { printed = 0 }
              /## \[Unreleased\]/ {
                print;
                print "";
                system("cat new_entries.txt");
                printed = 1;
                next
              }
              /## \[Unreleased\]\n- No unreleased changes at this time./ {
                print "## [Unreleased]";
                print "";
                system("cat new_entries.txt");
                printed = 1;
                next
              }
              printed == 0 && /^## \[[0-9]+\.[0-9]+\.[0-9]+\]/ {
                print "## [Unreleased]";
                print "";
                system("cat new_entries.txt");
                printed = 1
              }
              { print }
              END {
                if (printed == 0) {
                  print "## [Unreleased]";
                  print "";
                  system("cat new_entries.txt");
                }
              }
            ' CHANGELOG.md > CHANGELOG_temp.md
            mv CHANGELOG_temp.md CHANGELOG.md
          fi

      - name: Commit and push updated CHANGELOG.md
        run: |
          git add CHANGELOG.md
          git commit -m "docs(changelog): auto-update CHANGELOG.md with new commits"
          git push
        continue-on-error: true
